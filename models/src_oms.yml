sources:
  - name: landing
    description: The primary source system for order management system(OMS) data analytics.  
    database: SLEEKMART_OMS
    schema: L1_LANDING
    config:
      freshness:
        warn_after: {count: 100, period: day}
        ##error_after: {count: 3, period: day}
    loaded_at_field: Updated_at

    tables:
      - name: customers
        description: The customers table from order management system(OMS).      
        identifier: customers
      - name: orders
        description: The orders table from order management system(OMS).      
        identifier: orders
      - name: orderitems
        description: The orderitems table from order management system(OMS).      
        identifier: orderitems
      - name: employees
        description: The employees table from order management system(OMS).      
        identifier: employees
        columns:
          - name: address
            description: Full Address of emplyees for Transport Arrangements.          
            tests:
              - not_null
              - string_not_empty
      - name: sales_us
        freshness: null
      - name: sales_europe
        freshness: null
      - name: sales_asia
        freshness: null
      - name: stores
      - name: suppliers
      - name: products

  - name: training
    database: SLEEKMART_OMS
    schema: TRAINING
    tables:
      - name: city_temperature
      - name: sales_us
      - name: sales_uk
      - name: sales_india

  - name: exttbl
    database: SOURCE_DEV
    schema: EXT_TBLS
    tables:
      - name: employees_ext
        external:
          location: "@source_dev.ext_tbls.s3_stage_emp"  
          file_format: "(type = csv, field_delimiter = ',', skip_header = 1, trim_space = true)"
        columns:
          - name: filename
            data_type: varchar
            expression: metadata$filename
          - name: asof_date        # 👈 file modified timestamp
            data_type: timestamp_ntz
            expression: metadata$file_last_modified
